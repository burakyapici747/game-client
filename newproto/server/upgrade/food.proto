syntax = "proto3";

package server;

option java_outer_classname = "FoodOuterClass";

message FoodData {
  uint32 food_id = 1;
  uint32 x = 2;
  uint32 y = 3;
  // field 4 (scale) kaldırıldı — yerine shape + value geldi.
  reserved 4;
  // Görsel şekil: 0=CIRCLE, 1=SQUARE, 2=TRIANGLE, 3=PENTAGON, 4=DEATH_DROP.
  // Sözleşme: server FoodShape.java <-> client Game.js FOOD_SHAPE_TEXTURES.
  uint32 shape = 5;
  // Bu yemin yendiğinde kazandırdığı skor. Ambient yemler sabit değerdedir;
  // ölüm sonrası düşen yemler (shape=DEATH_DROP) daha yüksek ve değişken değer taşır.
  uint32 value = 6;
}

message FoodCollection {
  repeated FoodData foods = 1;
}
