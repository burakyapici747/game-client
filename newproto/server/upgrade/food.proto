syntax = "proto3";

package server;

option java_outer_classname = "FoodOuterClass";

message FoodData {
  uint32 food_id = 1;
  uint32 x = 2;
  uint32 y = 3;
  // field 4 (scale) ve field 5 (shape) kaldırıldı — tüm yemler artık düz
  // parlayan DAİRE; şekil çeşitliliği (polygon) kaldırıldı.
  reserved 4, 5;
  // Bu yemin yendiğinde kazandırdığı skor. Ambient yemler sabit değerde;
  // ölüm/eject sonrası düşen yemler daha yüksek ve değişken değer taşır.
  uint32 value = 6;
}

message FoodCollection {
  repeated FoodData foods = 1;
}
