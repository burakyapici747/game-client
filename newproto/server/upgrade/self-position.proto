syntax = "proto3";

package server;

message SelfPosition {
  uint32 entity_id = 1;
  float x = 2;
  float y = 3;
  // ── OLCEK: ACIK VARLIK (M01) ──────────────────────────────────────────────
  // YOK => olcek DEGISMEDI, istemci elindekini korur.
  // VAR => mutlak otoriter olcek.
  //
  // NEDEN BURADA `optional` GECERLI, EntityCollection.scales'te DEGIL:
  // varlik (field presence) TEKIL alanlarin ozelligidir. SelfPosition tekil
  // bir mesajdaki tekil bir alandir, dolayisiyla proto3 `optional` burada
  // dogrudan calisir. Dusman olcekleri ise PAKETLENMIS bir dizidir; orada
  // eleman bazli varlik diye bir sey yoktur (bkz. entity-collection.proto).
  //
  // Istemci varligi ACIKCA test etmelidir (`!= null`); DOGRULUK (truthiness)
  // uzerinden cikarim YAPILAMAZ — 0 gecersiz bir olcektir ama falsy'dir.
  optional float scale = 4;
  uint32 last_processed_sequence_id = 5;

  // OTORITER TOPLAM SKOR.
  //
  // NEDEN BURADA: SelfPosition zaten HER TICK ve YALNIZCA ilgili oyuncuya
  // gonderilir — skoru tasimak icin dogal yer burasidir ve TEK bir ek paket
  // gerektirmez. Onceki tek otoriter kaynak LeaderboardUpdate.self_score idi
  // ve o yalnizca 5 SANIYEDE BIR yayinlanir; arada istemci skoru kendi
  // tahminiyle yuruttugu icin her yayinla birlikte gorunur bir siçrama
  // olusuyordu (skor "zipliyor" sikayeti).
  //
  // proto3 EKLEMELI: alan 6 yeni; eski istemciler bilinmeyen alani yok sayar,
  // dolayisiyla tel formati geriye donuk uyumludur.
  uint32 total_score = 6;

  // Oyuncunun KENDI dogum dokunulmazligi. HER TICK gonderilir.
  //
  // NEDEN StartInformation'daki sure YETMEZ: tek seferlik bir sure, istemcinin
  // kendi sayacini isletmesini gerektirirdi ve o sayac istemci tarafinda
  // uzatilabilir olurdu. Bayragi her tick gondermek otoriteyi tamamen sunucuda
  // birakir — paket dokunulmazligin bittigini soyledigi ANDA efekt biter.
  //
  // Oyuncunun kendi entity'si EntityCollection'da BULUNMAZ (SnapshotSystem
  // gozlemciyi kendi gorunur kumesinden cikarir), bu yuzden bayrak burada
  // tasinmak zorundadir.
  bool invulnerable = 7;
  // ── OTORITER ETKIN BOOST DURUMU ─────────────────────────────────────────
  //
  // NEDEN GEREKLI: boost istemcide TAHMIN edilir (girdi gecikmesi hizalamasi
  // ile, bkz. Game.js _inputDelayQueue), ama protokolde boost'u tasiyan
  // HICBIR alan yoktu. Dolayisiyla istemci tahmininin DOGRU olup olmadigini
  // ogrenebilecegi tek gozlem konum kaymasiydi ve reconciliation o kaymayi
  // sessizce yutuyordu.
  //
  // AYRISMA MALIYETI (olculmus): istemci boost tahmin eder, sunucu etmezse
  // hata 450-225 = 225 px/sn ile birikir. Istemcinin duzeltme orani
  // RECONCILIATION_POSITION_FACTOR=0.10/kare ≈ 6·hata/sn, tavan 300 px/sn;
  // denge noktasi 6·e = 225 → e ≈ 37.5 px. Bu deger HARD_SNAP esiginin
  // (800 px) ALTINDA oldugu icin oyuncu HICBIR ZAMAN bir sicrama gormez —
  // sadece kafasi, carpismalarin gercekten cozuldugu yerin ~1.5 kafa capi
  // onunde durur. Yani "gozle gecmis gorundugum bosluktan olmek".
  //
  // BU ALAN SUNUCUNUN ETKIN DURUMUDUR (boostActive), oyuncunun niyeti
  // (boostRequested) DEGILDIR. Istemci bunu bir GECIKME EKLEMEK icin degil,
  // AYRISMA TESPITI icin kullanir: kendi tahmini sunucununkinden bir tam
  // gidis-donusten UZUN sure farkli kalirsa tahmini birakir (bkz. Snake.js
  // applyAuthoritativeBoost). Normal durumda ikisi ayni oldugu icin
  // tahminin tepki suresine HICBIR SEY eklenmez.
  //
  // proto3 EKLEMELI: alan 8 yeni; eski istemciler bilinmeyen alani yok sayar.
  bool boost_active = 8;
}
