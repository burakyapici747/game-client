syntax = "proto3";

package server;

message StartInformation {
  uint32 clientId = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 segment_count = 4;
  uint32 start_direction = 5;
  float scale = 6;
  float world_radius = 7;
  float invulnerable_seconds = 8;

  // Baglanti anindaki skin (LootLocker varlik id'si). Misafir icin kesin
  // degerdir; SOCIAL oyuncuda yalnizca BASLANGIC gorseli olup katilim
  // cozumlenince JoinAccepted.skin_id ile ezilir (bkz. join-accepted.proto).
  uint32 skin_id = 9;
}
