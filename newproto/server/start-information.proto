syntax = "proto3";

package server;

message StartInformation {
  uint32 clientId = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 segment_count = 4;
  uint32 start_direction = 5;
  float scale = 6;
  float world_radius = 7;

  // Oyuncunun KENDI dogum dokunulmazliginin suresi (saniye).
  // Istemci gorsel efekti bu sureye gore calistirir; sure SUNUCUDA islenir,
  // istemci uzatamaz (bkz. InvulnerabilitySystem).
  float invulnerable_seconds = 8;
}