syntax = "proto3";

package server;

import "server/start-information.proto";
import "server/pong.proto";
import "server/new-entity.proto";
import "server/remove-entity.proto";
import "server/update-entity.proto";
import "server/upgrade/entity-collection.proto";
import "server/upgrade/self-position.proto";
import "server/upgrade/segment-mutation.proto";
import "server/upgrade/food.proto";
import "server/upgrade/food-mutation.proto";
import "server/upgrade/death-notification.proto";
import "server/upgrade/leaderboard.proto";
import "server/upgrade/path-seed.proto";

message ServerEnvelope {
  oneof payload {
    StartInformation start_information = 1;
    EntityCollection entity_collection = 2;
    RemoveEntity remove_entity = 3;
    Pong pong = 4;
    DeathNotification death_notification = 5;
  }
  SelfPosition self_position = 10;
  SegmentMutationCollection segment_mutation_collection = 11;
  FoodCollection food_collection = 12;
  FoodMutationCollection food_mutation_collection = 13;
  // Siralama yayini — oneof DISINDA, cunku normal snapshot zarfina
  // eklenerek gonderilir (ayri paket/round-trip yok). Yalnizca throttle
  // penceresi acikken ve siralama degistiginde doldurulur; diger tick'lerde
  // alan hic yazilmaz (proto3: sifir bayt).
  LeaderboardUpdate leaderboard_update = 14;
  // Ilk karsilasma path tohumu — leaderboard_update ile ayni gerekce ile
  // oneof DISINDA: entity'yi ilk kez ortaya cikaran EntityCollection zarfina
  // eklenir, ayri paket/round-trip yoktur. Yalnizca ilk gorunurlukte (veya
  // uzun bir gorunurluk boslugundan sonra) doldurulur; diger tick'lerde alan
  // hic yazilmaz (proto3: sifir bayt). Bkz. upgrade/path-seed.proto.
  PathSeedCollection path_seed_collection = 15;
}
