<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <title>TABUMU GAME</title>
</head>

<body>
    <div id="app">
        <!-- Phaser Game Container (hidden initially or under UI) -->
        <div id="game-container"></div>
        
        <!-- UI Layer Overlay -->
        <div id="ui-layer" class="ui-layer">
            <div class="top-bar">
                <div class="settings-wrapper">
                    <button id="settings-btn" class="icon-btn" title="Settings">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>

                    <!-- Settings Panel (toggled by gear button) -->
                    <div id="settings-panel" class="settings-panel">
                        <div class="settings-panel-header">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                                <line x1="12" y1="18" x2="12.01" y2="18"></line>
                            </svg>
                            Mobile Controls
                        </div>

                        <div class="mc-row">
                            <span class="mc-label">Joystick Side</span>
                            <div class="mc-side-picker">
                                <button class="mc-side-btn active" data-side="left">
                                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M10 8H4m0 0l3-3M4 8l3 3"/></svg>
                                    Left
                                </button>
                                <button class="mc-side-btn" data-side="right">
                                    Right
                                    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M6 8h6m0 0l-3-3m3 3l-3 3"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="mc-row">
                            <span class="mc-label">Control Size</span>
                            <div class="mc-size-row">
                                <span id="mc-scale-display">100%</span>
                                <input type="range" id="mc-scale-slider" min="70" max="130" value="100" step="5">
                            </div>
                        </div>

                        <div class="mc-row">
                            <span class="mc-label">Opacity</span>
                            <div class="mc-size-row">
                                <span id="mc-opacity-display">70%</span>
                                <input type="range" id="mc-opacity-slider" min="20" max="100" value="70" step="5">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <main class="main-menu-content">
                <!-- Logo & Branding -->
                <div class="brand float-anim">
                    <div class="brand-logo-ring">
                        <img src="/assets/logo_image.jpeg" alt="TABUMU GAME mascot logo" />
                    </div>
                    <h1 class="brand-title">TABUMU GAME</h1>
                </div>

                <!-- Login Card -->
                <div class="login-card">
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                        <input type="text" id="nickname-input" placeholder="Enter Nickname" maxlength="16" autocomplete="off" />
                    </div>

                    <button id="play-btn" class="play-btn">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"></path>
                        </svg>
                        PLAY
                    </button>

                    <button id="servers-btn" class="servers-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M4 5h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 2.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM4 13h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm2 2.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path>
                        </svg>
                        Servers
                    </button>
                </div>
            </main>

            <!-- Footer -->
            <footer class="menu-footer">
                <div class="menu-footer-brand">TABUMU GAME</div>
                <nav class="menu-footer-links">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>
                    <a href="#">Community Guidelines</a>
                </nav>
                <div class="menu-footer-copy">© 2026 TABUMU GAME. Stay Slithery!</div>
            </footer>
        </div>

        <!-- In-game joystick/boost controls are rendered as native Phaser
             GameObjects (this.add.circle / this.add.zone) by
             src/game/ui/MobileControls.js — no DOM overlay needed here. -->

        <!-- ══════════════════════════════════════════════════════════════
             UNIFIED HTML/CSS OVERLAYS (managed by src/ui/overlays.js)
             Intermediate screens live OVER the canvas, not inside Phaser.
             ══════════════════════════════════════════════════════════════ -->

        <!-- Connecting Screen -->
        <div id="connecting-overlay" class="connecting-overlay hidden">
            <!-- Decorative Background Elements -->
            <div class="connecting-overlay-blob connecting-overlay-blob-1"></div>
            <div class="connecting-overlay-blob connecting-overlay-blob-2"></div>

            <div class="connecting-card">
                <!-- Loading Animation Container (Rolling Egg) -->
                <div class="egg-loader-container">
                    <div class="egg-loader-ring"></div>
                    <div class="egg-loader">
                        <div class="egg-eye egg-eye-left"></div>
                        <div class="egg-eye egg-eye-right"></div>
                        <div class="egg-blush egg-blush-left"></div>
                        <div class="egg-blush egg-blush-right"></div>
                    </div>
                </div>

                <!-- Status Text -->
                <div class="connecting-status">
                    <h2 class="connecting-title">Waiting For Server...</h2>
                    <div class="connecting-info">
                        <span class="info-label">Server:</span>
                        <span id="conn-server-name" class="info-value">--</span>
                        <span class="info-separator">|</span>
                        <span class="info-label">Ping:</span>
                        <span id="conn-ping-value" class="info-value">--</span>
                    </div>
                </div>

                <!-- Progress Bar with Snake Animation -->
                <div class="connecting-progress-bar">
                    <div class="snake-animation">
                        <div class="snake-segment snake-segment-1"></div>
                        <div class="snake-segment snake-segment-2"></div>
                        <div class="snake-segment snake-segment-3"></div>
                        <div class="snake-segment snake-segment-4"></div>
                        <div class="snake-head">
                            <div class="snake-eye snake-eye-1"></div>
                            <div class="snake-eye snake-eye-2"></div>
                        </div>
                    </div>
                </div>

                <!-- Cancel Button -->
                <button id="conn-cancel-btn" class="connecting-cancel-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
                    </svg>
                    Cancel Connection
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-overlay" class="game-overlay hidden">
            <div class="overlay-card">
                <h2 class="gameover-title">GAME OVER</h2>
                <div class="gameover-score-label">Final Score</div>
                <div id="gameover-score" class="gameover-score">0</div>
                <button id="gameover-play-again" class="overlay-btn overlay-btn-primary">PLAY AGAIN</button>
            </div>
        </div>

        <!-- Server Selection Modal (reference: server_list.html) -->
        <div id="servers-modal" class="servers-modal hidden">
            <div class="servers-modal-backdrop"></div>
            <div class="servers-card">
                <header class="servers-card-header">
                    <h2>Select Server</h2>
                    <button id="close-servers-btn" class="servers-close-btn" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </header>

                <!-- Cards rendered from public/config.json by renderServerList();
                     ping + latency tier measured live by measureServerPings(). -->
                <ul id="server-list" class="servers-cards-list" role="listbox"></ul>

                <div class="servers-card-footer">
                    <button id="confirm-server-btn" class="servers-confirm-btn">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
